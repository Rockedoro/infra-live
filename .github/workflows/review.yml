name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: self-hosted # Используем ваш локальный раннер
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Нужно для git diff между ветками

      - name: Run AI Review Script
        env:
          GITHUB_TOKEN: ${{ env.RUNNER_GH_PAT }}
          OLLAMA_HOST: http://ollama:11434
        run: |
          chmod +x .github/scripts/review.sh
          bash .github/scripts/review.sh

      - name: Debug Token
        run: |
          echo "Token length: ${#GITHUB_TOKEN}"
          echo "Token starts with: ${GITHUB_TOKEN:0:5}..."
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}