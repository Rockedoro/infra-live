services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5-coder:7b && echo 'Model ready'"]
    restart: "no"

  github-runner:
    image: myoung34/github-runner:latest
    container_name: github-runner
    env_file:
      - .env # Загружаем переменные отсюда
    environment:
      RUNNER_NAME: local-devops-runner
      RUNNER_WORKDIR: /tmp/actions-runner
      LABELS: linux,x64,self-hosted
      ACCESS_TOKEN: ${GH_PAT} # Используем переменную из .env
      REPO_URL: ${REPO_URL}   # Используем переменную из .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_data:/tmp/actions-runner
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started

volumes:
  ollama_data:
  runner_data: